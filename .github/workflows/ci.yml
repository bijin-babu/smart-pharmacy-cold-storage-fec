name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Syntax / import check (sensors, fog node, Lambda handlers)
        run: |
          python -m py_compile sensors/sensor_simulator.py sensors/fog_node.py
          python -m py_compile backend/lambda_ingest_telemetry.py backend/lambda_ingest_alerts.py backend/lambda_api_handler.py

      - name: Run sensor + fog node in dry-run mode (no AWS credentials required)
        working-directory: sensors
        run: python3 fog_node.py --dry-run --duration 15

  deploy:
    name: Deploy backend to AWS
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Learner Lab session credentials are still valid
        run: aws sts get-caller-identity

      - name: Deploy / update backend
        working-directory: infra
        run: |
          chmod +x deploy.sh
          ./deploy.sh

  # Note: redeploying the EC2-hosted copy of the dashboard
  # (infra/deploy_dashboard_ec2.sh) is intentionally not wired into this
  # pipeline. Getting it running non-interactively over SSH turned out to
  # need real debugging (a pkill self-match killing its own session, then
  # a background process hang that needed setsid to fix) and re-running it
  # here to also chase the timing kept costing more time than it was worth
  # this close to the deadline. The script itself is finished and works
  # when run by hand; it's just not on the automatic path yet.
